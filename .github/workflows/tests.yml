name: .NET Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Run tests with TRX output
        run: dotnet test BookBuddy.Tests/BookBuddy.Tests.csproj --logger "trx;LogFileName=test.trx" || true

      - name: Test Reporter
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: BookBuddy Tests
          path: "**/TestResults/**/*.trx"
          reporter: dotnet-trx
